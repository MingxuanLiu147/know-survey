<script>

    function buildBreadCrumbSchema() {
          const breadcrumbDiv = document.querySelector('.stb-breadcrumbs');
          const schema = {
          "@context": "https://schema.org/",
          "@type": "BreadcrumbList",
          "itemListElement": []
          };

          const items = breadcrumbDiv.getElementsByClassName('tw:items-center');
          Array.from(items).forEach((item, index) => {
          const link = item.querySelector('a');
          const textBlock = item.querySelectorAll('span')[1];
          const text = link ? link.textContent.trim() : textBlock.textContent.trim();
          const isLink = link && link.href;

          if (text !== '/') {
               const listItem = {
               "@type": "ListItem",
               "position": index + 1,
               "name": text
               };
               if (isLink) {
               listItem.item = link.href;
               } else {
               listItem.item = window.location.href; // Add current URL for non-link items
               }
               schema.itemListElement.push(listItem);
          }
          });

          return schema;
    }

    function initBreadCrumbSchema() {
        try {
            const breadcrumbDiv = document.querySelector('.stb-breadcrumbs');
            if (!breadcrumbDiv) return;
            const schema = buildBreadCrumbSchema();
            window.SchemaUtils.injectSchema(schema, "BreadcrumbList");

        } catch (error) {
            console.error("Failed to generate Breadcrumb schema:", error);
        }
    }

    (function () {
        if (isTranslationPage()) {
            window.registerTranslationComplete(initBreadCrumbSchema);

            const run = () => setTimeout(initBreadCrumbSchema, 300);
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', run);
            } else {
                run();
            }
        }
    })();

    function waitForElementToExist(selector) {
      return new Promise((resolve) => {
        if (document.querySelector(selector)) {
          return resolve(document.querySelector(selector));
        }

        const observer = new MutationObserver(() => {
          if (document.querySelector(selector)) {
            resolve(document.querySelector(selector));

            observer.disconnect();
          }
        });

        observer.observe(document.body, {

<script>
    function getFirstNonEmptyPAfterH1(h1) {
        const parent = getStbParentElement(h1);
        if (!parent) return '';
        const pTags = Array.from(parent.querySelectorAll('p'));
        for (const p of pTags) {
            const text = p.textContent.replace(/\u00a0|&nbsp;/g, '').trim();
            if (text.length > 0) {
                return p.textContent.trim();
            }
        }
        return '';
    }

    function getStbParentElement(el) {
        let parent = el.parentElement;
        while (parent && !/^stb-/i.test(parent.tagName)) {
            parent = parent.parentElement;
        }
        return parent || null;
    }

    function getImageFromElement(el) {
        if (!el) return '';
        const imgEl = el.querySelector('img');
        return (imgEl && imgEl.src) ? imgEl.src : '';
    }

    function buildSchema() {
        const h1 = document.querySelector('h1');
        let headline = '';
        let description = '';
        let image = '';
        let parent = null;

        if (h1) {
            headline = h1.textContent.trim();
            description = getFirstNonEmptyPAfterH1(h1);
            parent = getStbParentElement(h1);
            if (parent) {
                if (parent.tagName.toLowerCase() === 'stb-masterhead') {
                    image = window.SchemaUtils.getMastheadImage();
                } else {
                    image = getImageFromElement(parent);
                }
            }
        } else { // Fallback: Use title tag and meta description as fallback
            const titleEl = document.querySelector('title');
            if (titleEl) {
                headline = titleEl.textContent.trim();
            }
            const metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc && metaDesc.content) {
                description = metaDesc.content.trim();
            }
            const stbMasthead = document.querySelector('stb-masterhead');
            if (stbMasthead) {
                image = window.SchemaUtils.getMastheadImage();
            }
        }

        const url = location.href;
        const logoUrl = getImageFromElement(document.querySelector('stb-main-navigation'));

        // HTL syntax to get dates directly from AEM page properties
        const datePublished = "2025\u002D10\u002D23";
        const dateModified = "2025\u002D12\u002D09";

        return {
            "@context": "https://schema.org",
            "@type": "Article",
            headline,
            description,
            url,
            ...(image.trim().length > 0 ? { image } : {}),
            datePublished,
            dateModified,
            publisher: [
                {
                    "@type": "Organization",
                    name: "VisitSingapore",
                    url: "https://www.visitsingapore.com/",
                    logo: {
                        "@type": "ImageObject",
                        url: logoUrl
                    }
                }
            ]
        };
    }

    function initArticleSchema() {
        try {
            const schema = buildSchema();
            if (schema) {
                window.SchemaUtils.injectSchema(schema, "Article");
            }
        } catch (error) {
            console.error("Failed to generate Article schema:", error);
        }
    }

       (function () {
        if (isTranslationPage()) {
             window.registerTranslationComplete(initArticleSchema);
        } else {
            const run = () => setTimeout(initArticleSchema, 300);
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', run);
            } else {
                run();
            }
        }
    })();

  
</script>
