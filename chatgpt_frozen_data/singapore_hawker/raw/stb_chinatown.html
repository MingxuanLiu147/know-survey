<script>

    function buildBreadCrumbSchema() {
          const breadcrumbDiv = document.querySelector('.stb-breadcrumbs');
          const schema = {
          "@context": "https://schema.org/",
          "@type": "BreadcrumbList",
          "itemListElement": []
          };

          const items = breadcrumbDiv.getElementsByClassName('tw:items-center');
          Array.from(items).forEach((item, index) => {
          const link = item.querySelector('a');
          const textBlock = item.querySelectorAll('span')[1];
          const text = link ? link.textContent.trim() : textBlock.textContent.trim();
          const isLink = link && link.href;

          if (text !== '/') {
               const listItem = {
               "@type": "ListItem",
               "position": index + 1,
               "name": text
               };
               if (isLink) {
               listItem.item = link.href;
               } else {
               listItem.item = window.location.href; // Add current URL for non-link items
               }
               schema.itemListElement.push(listItem);
          }
          });

          return schema;
    }

    function initBreadCrumbSchema() {
        try {
            const breadcrumbDiv = document.querySelector('.stb-breadcrumbs');
            if (!breadcrumbDiv) return;
            const schema = buildBreadCrumbSchema();
            window.SchemaUtils.injectSchema(schema, "BreadcrumbList");

        } catch (error) {
            console.error("Failed to generate Breadcrumb schema:", error);
        }
    }

    (function () {
        if (isTranslationPage()) {
            window.registerTranslationComplete(initBreadCrumbSchema);
        } else {
            const run = () => setTimeout(initBreadCrumbSchema, 300);
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', run);
            } else {
                run();
            }
        }
    })();
     
    
</script>

<script defer>
    function waitForElementToExist(selector) {
      return new Promise((resolve) => {
        if (document.querySelector(selector)) {
          return resolve(document.querySelector(selector));
        }

        const observer = new MutationObserver(() => {
          if (document.querySelector(selector)) {
            resolve(document.querySelector(selector));

            observer.disconnect();
          }
        });

        observer.observe(document.body, {
          subtree: true,

          childList: true,
        });
      });
    }

    waitForElementToExist("wog-sentiments").then(function () {
