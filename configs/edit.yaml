# Know-Surgery Knowledge Editing 入口配置
# 用于知识编辑任务，支持 ROME, MEMIT, MEND 等方法

defaults:
  - model: Llama-3.2-3B-Instruct
  - trainer: edit/ROME
  - data: edit
  - collator: DataCollatorForSupervisedDataset
  - eval: edit
  - hydra: default
  - paths: default
  - _self_
  - experiment: null

# 训练模式
mode: edit

# 任务名（用于输出目录）
task_name: ???

# 编辑配置
edit_type: single  # single | batch | sequential | independent (edit/eval/restore)
max_edits: null
save_edit_summary: true
save_edited_model: true
# Keep the pre-edit locality reference on CPU by default. Multi-GPU smoke runs
# may set an explicit visible device such as cuda:1.
edit_reference_device: cpu
# Optional successful-prefix checkpoints, e.g. [5, 10, 20]. Each checkpoint
# evaluates all edits committed so far against the pristine locality reference.
# Requires edit_type=sequential and trainer.args.do_eval=true.
edit_history_eval_steps: []
