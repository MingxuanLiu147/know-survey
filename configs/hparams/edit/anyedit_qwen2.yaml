# Compatibility contract for Qwen2 text models with AnyEdit.
# This file enables registry validation; the experiment remains Configured
# until a matching model/dataset smoke or benchmark artifact is available.

model_family: qwen2
handler: AnyEditEditor
parameters:
  layer_module_tmp: "model.layers.{}"
  rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
  ln_f_module: "model.norm"
  lm_head_module: "lm_head"
