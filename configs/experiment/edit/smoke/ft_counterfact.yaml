# @package _global_
# Real (non-cached) FT smoke on tiny CounterFact fixtures.
# Prerequisite:
#   Set data.edit.CounterFact_edit.args.data_path to a local CounterFact JSON file.

defaults:
  - override /model: Qwen2.5-7B-Instruct
  - override /trainer: edit/FT
  - override /data: edit
  - override /data/datasets@data.edit: CounterFact_edit
  - override /eval: edit

task_name: smoke_ft_cf
edit_type: single
max_edits: 1
save_edit_summary: true
save_edited_model: false

trainer:
  args:
    do_eval: true
    bf16: false
  method_args:
    layers: [4, 5]
    ft_lr: 5e-5
    num_steps: 10
    edit_layers_only: true

data:
  edit:
    CounterFact_edit:
      handler: CounterFactDataset
      args:
        split: "train"
        max_length: 256
        data_path: data/edit/counterfact/counterfact_train.json
