# @package _global_

defaults:
  - override /model: gpt2
  - override /trainer: edit/AnyEdit
  - override /data: edit
  - override /data/datasets@data.edit: EditEvery_edit
  - override /eval: edit

task_name: real_gpt2_editevery_memit_are_current
max_edits: 1
save_edited_model: false

trainer:
  method_args:
    layers: [5]
    strategy: memit_are
    window_size: 100
    overlap: 0
    v_num_grad_steps: 1
    rewrite_module_tmp: "transformer.h.{}.mlp.c_proj"
    layer_module_tmp: "transformer.h.{}"
    mom2_adjustment: true
    mom2_dataset: wikitext
    mom2_n_samples: 8
    covariance_ridge: 0.1

data:
  edit:
    EditEvery_edit:
      handler: EditEveryDataset
      args:
        max_length: 1024
        apply_chat_template: false
