# @package _global_
# Canonical AnyEdit MEMIT_ARE protocol on EditEverything.

defaults:
  - override /model: Qwen2.5-7B-Instruct
  - override /trainer: edit/AnyEdit
  - override /data: edit
  - override /data/datasets@data.edit: EditEvery_edit
  - override /eval: edit

task_name: editevery_memit_are

trainer:
  method_args:
    strategy: memit_are
    window_size: 50
    overlap: 0

data:
  edit:
    EditEvery_edit:
      handler: EditEveryDataset
      args:
        max_length: 2048
        apply_chat_template: true

