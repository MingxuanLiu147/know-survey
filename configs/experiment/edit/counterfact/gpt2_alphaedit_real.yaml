# @package _global_

defaults:
  - override /model: gpt2
  - override /trainer: edit/AlphaEdit
  - override /data: edit
  - override /data/datasets@data.edit: CounterFact_edit
  - override /eval: edit

trainer:
  method_args:
    layers: [5]
    rewrite_module_tmp: "transformer.h.{}.mlp.c_proj"
    layer_module_tmp: "transformer.h.{}"
    lm_head_module: "lm_head"
    ln_f_module: "transformer.ln_f"
    mom2_dataset: wikitext
    mom2_n_samples: 8
    nullspace_threshold: 1.0e-2
    l2: 1.0
    v_num_grad_steps: 3
    projection_path: "data/stats/gpt2/alphaedit_layer5_p.pt"

data:
  edit:
    CounterFact_edit:
      handler: CounterFactDataset
      args:
        split: train
        max_length: 256
