# @package _global_
# Model-specific text WISE configuration for Qwen2.5-7B.
# Layer/path and core hyperparameters follow the EasyEdit Qwen2.5 WISE config.

defaults:
  - override /model: Qwen2.5-7B-Instruct
  - override /trainer: edit/WISE
  - override /data: edit
  - override /data/datasets@data.edit: CounterFact_edit
  - override /eval: edit

task_name: wise_qwen25_7b_counterfact_configured
edit_type: single
max_edits: 1
save_edited_model: false

trainer:
  method_args:
    layers: [23]
    inner_params: "model.layers.23.mlp.down_proj"
    edit_lr: 1.0
    n_iter: 70
    mask_ratio: 0.2
    norm_constraint: 1.0
    act_ratio: 0.88
    save_freq: 500
    merge_freq: 1000
    merge_strategy: "ties"
    merge_weight: 1.0
    density: 0.53
    alpha: 5.0
    beta: 20.0
    gamma: 10.0
