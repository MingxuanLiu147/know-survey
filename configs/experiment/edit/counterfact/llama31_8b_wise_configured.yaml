# @package _global_
# Model-specific WISE configuration for Llama-3.1-8B.
# Layer/path and core hyperparameters follow the EasyEdit Llama-3.1 WISE config.

defaults:
  - override /model: Llama-3.1-8B-Instruct
  - override /trainer: edit/WISE
  - override /data: edit
  - override /data/datasets@data.edit: CounterFact_edit
  - override /eval: edit

task_name: wise_llama31_8b_counterfact_configured
edit_type: single
max_edits: 1
save_edited_model: false

trainer:
  method_args:
    layers: [29]
    inner_params: "model.layers.29.mlp.down_proj"
    edit_lr: 0.9
    n_iter: 30
    mask_ratio: 0.2
    norm_constraint: 1.0
    act_ratio: 0.88
    save_freq: 500
    merge_freq: 1000
    merge_strategy: "ties"
    merge_weight: 1.0
    density: 0.53
    alpha: 5.0
    beta: 10.0
    gamma: 10.0
