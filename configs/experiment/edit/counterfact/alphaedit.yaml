# @package _global_
# AlphaEdit paper benchmark: CounterFact sequential factual editing.

defaults:
  - override /model: Qwen2.5-7B-Instruct
  - override /trainer: edit/AlphaEdit
  - override /data: edit
  - override /data/datasets@data.edit: CounterFact_edit
  - override /eval: edit

data:
  edit:
    CounterFact_edit:
      handler: CounterFactDataset
      args:
        split: train
        max_length: 512
