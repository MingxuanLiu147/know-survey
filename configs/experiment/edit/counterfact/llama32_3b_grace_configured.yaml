# @package _global_
# Model-specific GRACE configuration for Llama-3.2-3B.
# Layer/path follows the EasyEdit Llama-3.2 GRACE configuration.

defaults:
  - override /model: Llama-3.2-3B-Instruct
  - override /trainer: edit/GRACE
  - override /data: edit
  - override /data/datasets@data.edit: CounterFact_edit
  - override /eval: edit

task_name: grace_llama32_3b_counterfact_configured
edit_type: single
max_edits: 1
save_edited_model: false

trainer:
  method_args:
    layers: [27]
    inner_params: "model.layers.27.mlp.down_proj"
    edit_lr: 1.0
    n_iter: 50
    eps: 1.0
    val_init: "cold"
    val_train: "sgd"
