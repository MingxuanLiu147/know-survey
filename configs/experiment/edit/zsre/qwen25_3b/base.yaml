# @package _global_
# Shared inputs and evaluation for the reviewed Qwen3B independent benchmark.
defaults:
  - override /model: Qwen2.5-3B-Instruct
  - override /data: edit
  - override /data/datasets@data.edit: ZSRE_edit
  - override /eval: edit_benchmark
  - _self_

edit_type: independent
max_edits: 1301
save_edit_summary: true
save_edited_model: false
model:
  model_args:
    attn_implementation: eager
    torch_dtype: bfloat16
trainer:
  args:
    output_dir: ${paths.output_dir}
    do_eval: true
    bf16: true
    seed: 42
benchmark:
  protocol: knowedit_zsre_with_rephrases
  version: reviewed_independent_v3
  configuration_status: candidate_requires_review
  metrics: teacher_forced_case_macro

data:
  edit:
    ZSRE_edit:
      handler: ZSREDataset
      args:
        # Set data_path explicitly, or configure KNOW_SURGERY_DATA_ROOTS.
        data_path: null
        expected_sha256: 0e0214dda853a906ef02bef58c7ce2978af5a962e91fc4a10827e0125459905c
        expected_num_samples: 1301
        split: test
        max_length: 512
        apply_chat_template: false
