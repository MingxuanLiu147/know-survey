# @package _global_
# Qwen2.5-7B-Instruct + FT, zsRE independent-100 benchmark.

defaults:
  - override /model: Qwen2.5-7B-Instruct
  - override /trainer: edit/FT
  - override /data: edit
  - override /data/datasets@data.edit: ZSRE_edit
  - override /eval: edit_benchmark
  - _self_

task_name: qwen25_7b_zsre_ft_independent100
edit_type: independent
max_edits: 100
save_edit_summary: true
save_edited_model: false

model:
  model_args:
    attn_implementation: eager

trainer:
  args:
    output_dir: ${paths.output_dir}
    do_eval: true
    bf16: true
    seed: 42
  method_args:
    layers: [23]
    ft_lr: 5.0e-5
    num_steps: 25
    weight_decay: 0.0
    edit_layers_only: true

data:
  edit:
    ZSRE_edit:
      handler: ZSREDataset
      args:
        split: test
        max_length: 512
