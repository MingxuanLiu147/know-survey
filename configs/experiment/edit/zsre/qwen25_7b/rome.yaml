# @package _global_
# Candidate settings: inspect --preflight and review layers before execution.
defaults:
  - /experiment/edit/zsre/qwen25_7b/base
  - override /trainer: edit/ROME_Official
  - _self_

task_name: qwen25_7b_zsre_rome_reviewed1301
trainer:
  method_args:
    layers: [5]
    v_loss_layer: 27  # Inactive with final_logits; shown in the review report.
    mom2_adjustment: true
    # Reviewed numerical variant for statistics only; editing keeps eager.
    # Preserve 100k documents and the 32768-token cap. Review for another model.
    mom2_max_length: 32768
    mom2_batch_tokens: 32768
    mom2_attention_policy: qwen2_eager_query_chunked
    mom2_query_chunk_size: 256
    mom2_placement_policy: qwen2_prefix
    mom2_require_cached: true  # Prepare matching complete statistics before editing.
    stats_dir: ${paths.root_dir}/data/stats/qwen25_7b/wikipedia_20200501_query256_100k_32768
