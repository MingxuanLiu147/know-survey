# @package _global_
# Supply archive from train_serac.py and independent heldout_edit.json.
defaults:
  - override /model: gpt2
  - override /trainer: edit/SERAC
  - override /data: edit
  - override /data/datasets@data.edit: ZSRE_edit
  - override /eval: edit
  - _self_

task_name: serac_prepared_smoke
edit_type: independent
max_edits: 2
save_edited_model: false

trainer:
  args:
    do_eval: true
    bf16: false
  method_args:
    archive: null

data:
  edit:
    ZSRE_edit:
      args:
        max_length: 256
