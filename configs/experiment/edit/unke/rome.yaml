# @package _global_
# UnKEBench long-form plain ROME baseline (not ROME+AnyEdit).

defaults:
  - override /model: Qwen2.5-7B-Instruct
  - override /trainer: edit/ROME
  - override /data: edit
  - override /data/datasets@data.edit: UnKE_edit
  - override /eval: edit

task_name: unke_rome

trainer:
  method_args:
    layers: [5]
    v_num_grad_steps: 25
    v_weight_decay: 1.0e-3
    v_loss_layer: 27
    mom2_adjustment: false

data:
  edit:
    UnKE_edit:
      handler: UnKEDataset
      args:
        version: v3
        max_length: 2048
        apply_chat_template: true

