# @package _global_
# Native AnyEdit on UnKEBench with Wikipedia 20200501.en statistics.
# Official-reference experiments keep their own corpus and sampling budgets.

defaults:
  - override /model: Qwen2.5-7B-Instruct
  - override /trainer: edit/AnyEdit
  - override /data: edit
  - override /data/datasets@data.edit: UnKE_edit
  - override /eval: edit

model:
  model_args:
    attn_implementation: sdpa

trainer:
  method_args:
    strategy: memit_are
    window_size: 50
    overlap: 0
    mom2_dataset: wikipedia
    mom2_dataset_config: "20200501.en"
    mom2_n_samples: 200
    mom2_max_length: 512
    mom2_batch_tokens: 512

data:
  edit:
    UnKE_edit:
      handler: UnKEDataset
      args:
        version: v3
        max_length: 1024
        apply_chat_template: true

task_name: unke_memit_are
