# @package _global_
# AnyEdit paper benchmark: UnKEBench with MEMIT+AnyEdit.

defaults:
  - override /model: Qwen2.5-7B-Instruct
  - override /trainer: edit/AnyEdit
  - override /data: edit
  - override /data/datasets@data.edit: UnKE_edit
  - override /eval: edit

trainer:
  method_args:
    strategy: memit_are
    window_size: 50
    overlap: 0

data:
  edit:
    UnKE_edit:
      handler: UnKEDataset
      args:
        version: v3
        max_length: 1024
        apply_chat_template: true

task_name: unke_memit_are
