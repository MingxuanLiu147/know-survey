# @package _global_

defaults:
  - override /model: gpt2
  - override /trainer: edit/AnyEdit
  - override /data: edit
  - override /data/datasets@data.edit: UnKE_edit
  - override /eval: edit

task_name: real_gpt2_unke_alphaedit_are
max_edits: 1
save_edited_model: false

trainer:
  method_args:
    layers: [5]
    strategy: alphaedit_are
    window_size: 40
    overlap: 0
    v_num_grad_steps: 2
    rewrite_module_tmp: "transformer.h.{}.mlp.c_proj"
    layer_module_tmp: "transformer.h.{}"
    projection_path: "data/stats/gpt2/alphaedit_layer5_p.pt"
    mom2_dataset: wikitext
    mom2_n_samples: 8
    l2: 10.0

data:
  edit:
    UnKE_edit:
      handler: UnKEDataset
      args:
        version: v3
        max_length: 1024
        apply_chat_template: false

