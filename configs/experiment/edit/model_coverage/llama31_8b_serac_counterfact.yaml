# @package _global_
# SERAC auxiliary-checkpoint gated; set archive to a newly trained supervised archive.
defaults:
- override /model: Llama-3.1-8B-Instruct
- override /trainer: edit/SERAC
- override /data: edit
- override /data/datasets@data.edit: CounterFact_edit
- override /eval: edit
- _self_
task_name: configured_llama31_8b_serac_counterfact
edit_type: single
max_edits: 1
save_edit_summary: true
save_edited_model: false
model:
  model_args:
    attn_implementation: eager
trainer:
  args:
    do_eval: true
    bf16: false
  method_args:
    archive: null
data:
  edit:
    CounterFact_edit:
      args:
        split: train
        max_length: 256
