# @package _global_
# AKEW CounterFact unstructured long target + plain ROME baseline.

defaults:
  - override /model: Qwen2.5-7B-Instruct
  - override /trainer: edit/ROME
  - override /data: edit
  - override /data/datasets@data.edit: AKEW_counterfact_unstructured_edit
  - override /eval: edit

task_name: akew_counterfact_rome_long

trainer:
  method_args:
    layers: [5]
    v_num_grad_steps: 25
    v_weight_decay: 1.0e-3
    v_loss_layer: 27
    mom2_adjustment: false

