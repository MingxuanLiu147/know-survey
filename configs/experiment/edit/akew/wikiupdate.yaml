# @package _global_
# AKEW WikiUpdate 子集实验配置

defaults:
  - override /model: Qwen2.5-7B-Instruct
  - override /trainer: edit/ROME
  - override /data: edit
  - override /data/datasets@data.edit: AKEW_wikiupdate_edit
  - override /eval: edit

data:
  edit:
    AKEW_wikiupdate_edit:
      handler: AKEWDataset
      args:
        subset: "wikiupdate"
        max_length: 512
