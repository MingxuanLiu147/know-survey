# @package _global_

defaults:
  - override /model: gpt2
  - override /trainer: edit/AnyEdit
  - override /data: edit
  - override /data/datasets@data.edit: AKEW_counterfact_unstructured_edit
  - override /eval: edit

task_name: real_gpt2_akew_cf_memit_are
max_edits: 1
save_edited_model: false

trainer:
  method_args:
    layers: [5]
    strategy: memit_are
    window_size: 40
    overlap: 0
    v_num_grad_steps: 2
    rewrite_module_tmp: "transformer.h.{}.mlp.c_proj"
    layer_module_tmp: "transformer.h.{}"
    mom2_adjustment: true
    mom2_dataset: wikitext
    mom2_n_samples: 8
    covariance_ridge: 0.1

data:
  edit:
    AKEW_counterfact_unstructured_edit:
      handler: AKEWDataset
      args:
        subset: counterfact
        target_mode: unstructured
        max_length: 1024
        apply_chat_template: false

