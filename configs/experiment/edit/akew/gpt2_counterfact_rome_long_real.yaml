# @package _global_

defaults:
  - override /model: gpt2
  - override /trainer: edit/ROME
  - override /data: edit
  - override /data/datasets@data.edit: AKEW_counterfact_unstructured_edit
  - override /eval: edit

task_name: rome_gpt2_akew_cf_edit_smoke_v2
max_edits: 1
save_edited_model: false

trainer:
  method_args:
    layers: [5]
    v_num_grad_steps: 2
    v_weight_decay: 1.0e-3
    mom2_adjustment: false
    rewrite_module_tmp: "transformer.h.{}.mlp.c_proj"
    layer_module_tmp: "transformer.h.{}"
    ln_f_module: "transformer.ln_f"

data:
  edit:
    AKEW_counterfact_unstructured_edit:
      handler: AKEWDataset
      args:
        subset: counterfact
        target_mode: unstructured
        max_length: 1024
        apply_chat_template: false
