# @package _global_
# Official AnyEdit UnKE_ARE protocol on AKEW MQuAKE-CF.

defaults:
  - override /model: Qwen2.5-7B-Instruct
  - override /trainer: edit/AnyEdit
  - override /data: edit
  - override /data/datasets@data.edit: AKEW_mquake_unstructured_edit
  - override /eval: edit

task_name: akew_mquake_unke_are

trainer:
  method_args:
    strategy: unke_are
    layers: [7]
    window_size: 50
    overlap: 0
    ft_lr: 2.0e-4
    ft_epochs: 50
    preservation_sample_size: 20

