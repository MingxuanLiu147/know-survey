# @package _global_
# Official VLKEB Table-2 one-hop Portability subset (1,278 independent edits).

defaults:
  - override /model: LLaVA-1.5-7B
  - override /trainer: edit/MM_IKE
  - override /data: vlkeb_edit
  - override /eval: mm_edit_portability_only

task_name: llava15_7b_vlkeb_onehop_mm_ike
edit_type: independent
max_edits: 1278
benchmark_expected_cases: 1278
resume_independent: true
progress_interval: 10
save_edit_summary: true
save_edited_model: false

data:
  edit:
    VLKEB:
      args:
        data_path: data/edit/vlkeb/eval_multihop.json
        portability_hop: 1

trainer:
  args:
    do_eval: true
    bf16: true
    seed: 42
