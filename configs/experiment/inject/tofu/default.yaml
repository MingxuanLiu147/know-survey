# @package _global_
# TOFU full-answer injection candidate, not the official unlearning protocol.
defaults:
  - override /model: Qwen2.5-1.5B
  - override /trainer: inject/LoRA
  - override /data: inject
  - override /data/datasets@data.train: Alpaca_inject
  - override /eval: tofu_inject
  - _self_
model:
  model_args:
    pretrained_model_name_or_path: ${oc.env:FACTQA_BASE_MODEL,Qwen/Qwen2.5-1.5B}
    attn_implementation: sdpa
    torch_dtype: bfloat16
  tokenizer_args:
    pretrained_model_name_or_path: ${model.model_args.pretrained_model_name_or_path}
  template_args:
    apply_chat_template: false
data:
  train:
    Alpaca_train:
      args:
        hf_args: null
        data_path: ${oc.env:TOFU_INJECT_TRAIN_PATH}
        append_eos: true
        max_length: 256
trainer:
  args:
    num_train_epochs: 1
    max_steps: -1
    # Materialize 3,998 QA rows x 50 in one epoch: 199,900 rows / 256 = 781 updates.
    # This avoids the installed Accelerate cross-epoch resume sampler limitation.
    per_device_train_batch_size: 128
    gradient_accumulation_steps: 2
    learning_rate: 1e-4
    warmup_ratio: 0.05
    weight_decay: 0.0
    lr_scheduler_type: linear
    bf16: true
    seed: 42
    data_seed: 42
    dataloader_num_workers: 0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs:
      use_reentrant: false
    optim: adamw_torch
    dataloader_drop_last: false
    group_by_length: false
    remove_unused_columns: false
    logging_steps: 10
    save_strategy: steps
    save_steps: 100
    save_total_limit: 3
    save_only_model: false
    report_to: none
    do_eval: false
    eval_strategy: 'no'
  method_args:
    lora_alpha: 16
    lora_dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj]
