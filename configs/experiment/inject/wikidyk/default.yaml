# @package _global_
# Paper QA-only protocol: 12,290 facts, 48,008 updates, global batch 256; one A100 per method.
defaults:
- override /model: Qwen2.5-1.5B
- override /trainer: inject/FT
- override /data: inject
- override /data/datasets@data.train: WikiDYK_train_inject
- override /eval: wikidyk
- _self_
task_name: wikidyk_ft
model:
  model_args:
    pretrained_model_name_or_path: ${oc.env:WIKIDYK_BASE_MODEL,Qwen/Qwen2.5-1.5B}
    attn_implementation: sdpa
    torch_dtype: float32
  tokenizer_args:
    pretrained_model_name_or_path: ${model.model_args.pretrained_model_name_or_path}
  template_args:
    apply_chat_template: false
collator:
  DataCollatorForSupervisedDataset:
    args:
      padding_side: left
data:
  train:
    WikiDYK_train:
      args:
        data_path: ${oc.env:WIKIDYK_QA_TRAIN_PATH,data/inject/wikidyk/train_qa.json}
        training_recipe: qa_only
        num_upsample: 1000
        append_eos: true
        max_length: 256
        loss_normalization: token
trainer:
  args:
    do_train: true
    do_eval: false
    seed: 42
    bf16: true
    num_train_epochs: 1
    per_device_train_batch_size: 128
    per_device_eval_batch_size: 4
    gradient_accumulation_steps: 2
    learning_rate: 2.0e-05
    weight_decay: 0.0
    warmup_ratio: 0.05
    lr_scheduler_type: linear
    logging_steps: 100
    save_steps: 2000
    save_total_limit: 3
    eval_strategy: 'no'
    eval_steps: 500
    optim: adamw_torch
    max_steps: -1
    gradient_checkpointing: false
    gradient_checkpointing_kwargs:
      use_reentrant: false
    data_seed: 42
    dataloader_num_workers: 0
    dataloader_drop_last: false
    group_by_length: false
    remove_unused_columns: false
    save_strategy: steps
    save_only_model: false
    report_to: none
    disable_tqdm: true
eval:
  wikidyk:
    eval_data_path: ${oc.env:WIKIDYK_EVAL_PATH,data/inject/wikidyk/eval.json}
    args:
      batch_size: 128
      max_length: 4096
      max_new_tokens: 100
      do_sample: false
