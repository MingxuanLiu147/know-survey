# @package _global_
# Same QA-only data, token-normalized loss and effective batch as Full FT.
defaults:
- /experiment/inject/wikidyk/default
- override /trainer: inject/LoRA
- _self_
task_name: wikidyk_lora
model:
  model_args:
    torch_dtype: bfloat16
trainer:
  args:
    per_device_train_batch_size: 256
    gradient_accumulation_steps: 1
    learning_rate: 0.0001
  method_args:
    r: 32
    lora_alpha: 16
    lora_dropout: 0.0
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    bias: none
    task_type: CAUSAL_LM
