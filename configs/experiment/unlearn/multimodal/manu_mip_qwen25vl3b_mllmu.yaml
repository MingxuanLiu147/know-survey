# @package _global_
# Released MANUPruner score and weight scaling; no optimizer steps.
defaults:
- override /model: Qwen2.5-VL-3B
- override /data: mllmu
- override /trainer: MMMANU
model:
  model_path: ???
  processor_path: ${model.model_path}
  preserve_saved_processor: true
  lora:
    enabled: false
data:
  training_source: ft_data
  training_parquet: ${data.data_dir}/ft_Data/train-00000-of-00001.parquet
  forget_split_ratio: 5
  batch_size: 64
  ans_only: true
  max_samples: null
  paired_modalities: true
trainer:
  method_args:
    denominator_mode: source_signed_sum
    variance_correction: 1
benchmark_protocol:
  source: https://github.com/PreckLi/MIP-Editor/blob/db8e6d2350c5e188f58a6bd38d92d2cebcb037cd/manu.py
  implementation: released-MANUPruner-score-and-weight-scaling
  status: prototype
  exact_replication: false
  retained_adaptations:
  - independent-valid-text-and-image-text-tokenization
  - last-non-padding-token-statistics
  - persistent-weight-scaling-equivalent-to-source-prehook
output_dir: saves/unlearning/manu_mip_qwen25vl3b_mllmu/${now:%Y-%m-%d_%H-%M-%S}
