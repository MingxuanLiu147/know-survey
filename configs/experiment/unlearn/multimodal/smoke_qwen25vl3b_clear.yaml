# @package _global_
# One-record Qwen2.5-VL-3B portability smoke on CLEAR.
defaults:
  - override /model: Qwen2.5-VL-3B
  - override /data: clear
  - override /trainer: MMGradAscent

model:
  processor_args:
    use_fast: false
    min_pixels: 200704
    max_pixels: 200704
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.0

data:
  forget_split_ratio: 5
  training_split_suffix: ""
  train_mode: caption
  batch_size: 1
  ans_only: true
  max_samples: 1

trainer:
  args:
    lr: 1e-5
    num_epochs: 1

smoke_protocol:
  model_role: portability-extension-not-benchmark-original
  configured_methods:
    - MMGradAscent
    - MMGradDiff
    - MMKLMin
    - MMNPO
    - MMRetainFT
    - MMSCRUB
    - MMUnlearner
    - MMMANU

output_dir: saves/mm_unlearn/smoke_qwen25vl3b_clear/${trainer.handler}
save_model: false
