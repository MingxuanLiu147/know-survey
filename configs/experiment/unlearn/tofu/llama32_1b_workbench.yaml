# @package _global_
# TOFU-trained Llama checkpoint with disjoint local scopes.
defaults:
- override /model: Llama-3.2-1B-Instruct
- override /trainer: GradDiff
- override /data: unlearn
- override /data/datasets@data.forget: TOFU_workbench_forget
- override /data/datasets@data.retain: TOFU_workbench_retain
- override /eval: null
- _self_
mode: unlearn
eval:
  tofu:
    handler: TOFUEvaluator
    output_dir: ${paths.output_dir}
    overwrite: false
    retain_logs_path: null
    metrics:
      forget_Q_A_Prob:
        handler: probability
        batch_size: 1
        datasets: ${data.forget}
        collators:
          DataCollatorForSupervisedDataset:
            handler: DataCollatorForSupervisedDataset
            args:
              padding_side: right
              index: index
      retain_Q_A_Prob:
        handler: probability
        batch_size: 1
        datasets: ${data.retain}
        collators:
          DataCollatorForSupervisedDataset:
            handler: DataCollatorForSupervisedDataset
            args:
              padding_side: right
              index: index
model:
  model_args:
    local_files_only: true
    pretrained_model_name_or_path: ${oc.env:KNOW_SURGERY_TOFU_MODEL_PATH,open-unlearning/tofu_Llama-3.2-1B-Instruct_full}
    attn_implementation: sdpa
  tokenizer_args:
    local_files_only: true
    pretrained_model_name_or_path: ${model.model_args.pretrained_model_name_or_path}
trainer:
  args:
    max_steps: 50
    num_train_epochs: 1
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 1
    learning_rate: 1.0e-05
    warmup_epochs: 0
    bf16: true
    bf16_full_eval: true
    gradient_checkpointing: true
    do_eval: true
    eval_on_start: true
    save_strategy: 'no'
    optim: adamw_torch
    report_to: none
    logging_steps: 1
data:
  anchor: forget
max_train_samples: 50
task_name: llama32_1b_tofu_graddiff_50
