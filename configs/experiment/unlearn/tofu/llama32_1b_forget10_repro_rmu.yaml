# @package _global_

# Published-source-aligned TOFU reproduction recipe.  Launch with two processes
# through configs/accelerate/default_config.yaml; 4 samples/device x 2 devices x 4
# accumulation steps gives the reference script's effective batch size of 32.
defaults:
  - /experiment/unlearn/tofu/default
  - override /trainer: RMU
  - _self_

trainer:
  args:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 1.0e-5
    optim: paged_adamw_32bit
    num_train_epochs: 10
    bf16: true
    gradient_checkpointing: true
    ddp_find_unused_parameters: true
    seed: 0
  method_args:
    gamma: 1.0
    steering_coeff: 2
    retain_loss_type: EMBED_DIFF
    alpha: 1.0
    module_regex: model\.layers\.7
    trainable_params_regex:
      - .*

task_name: tofu_llama32_1b_forget10_repro_rmu
