# Know-Surgery method catalog.
schema_version: '1.0'
operation: edit
status_order:
- registered
- configured
- verified
compatibility_templates:
  registered:
    status: registered
    experiment: null
    evidence: null
    mapping_profile: null
    notes: Catalogued only; model-method execution compatibility is not claimed.
methods:
  FTEditor:
    config: configs/trainer/edit/FT.yaml
    compatibility_class: architecture_independent
    requirements: []
  IKEEditor:
    config: configs/trainer/edit/IKE.yaml
    compatibility_class: architecture_independent
    requirements:
    - retrieval_backend
  SERACEditor:
    config: configs/trainer/edit/SERAC.yaml
    compatibility_class: meta_checkpointed
    requirements:
    - trained_scope_encoder_and_counterfactual_archive
    - matching_causal_tokenizer
    - disjoint_auxiliary_training_split
  ROMEEditor:
    config: configs/trainer/edit/ROME.yaml
    compatibility_class: layer_mapped
    requirements:
    - rewrite_module_mapping
    - layer_module_mapping
    - covariance_statistics
  MEMITEditor:
    config: configs/trainer/edit/MEMIT.yaml
    compatibility_class: layer_mapped
    requirements:
    - rewrite_module_mapping
    - layer_module_mapping
    - covariance_statistics
  AlphaEditEditor:
    config: configs/trainer/edit/AlphaEdit.yaml
    compatibility_class: layer_mapped
    requirements:
    - rewrite_module_mapping
    - layer_module_mapping
    - projection_statistics
  GRACEEditor:
    config: configs/trainer/edit/GRACE.yaml
    compatibility_class: layer_mapped
    requirements:
    - inner_parameter_mapping
  AnyEditEditor:
    config: configs/trainer/edit/AnyEdit.yaml
    compatibility_class: backend_dependent
    requirements:
    - memit_are
    - alphaedit_are
    - backend_model_mapping
  MENDEditor:
    config: configs/trainer/edit/MEND.yaml
    compatibility_class: meta_checkpointed
    requirements:
    - architecture_matched_edit_network_checkpoint
  MALMENEditor:
    config: configs/trainer/edit/MALMEN.yaml
    compatibility_class: meta_checkpointed
    requirements:
    - architecture_matched_meta_network_checkpoint
  InstructEditEditor:
    config: configs/trainer/edit/InstructEdit.yaml
    compatibility_class: meta_checkpointed
    requirements:
    - architecture_matched_instructedit_checkpoint
    - task_template_registration
  WISEMergeEditor:
    config: configs/trainer/edit/WISE.yaml
    compatibility_class: layer_mapped
    requirements:
    - value_projection_mapping
    - independent_scope_training_negatives
    - context_templates
