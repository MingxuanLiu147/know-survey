# WISE: Knowledge Memory for Lifelong Model Editing
# Paper: https://arxiv.org/abs/2405.14768

defaults:
  - edit/base_editor@_here_
  - _self_

handler: WISEEditor

method_args:
  # `auto` maps GPT-2 to mlp.c_fc (Conv1D) and Qwen/Llama to
  # mlp.down_proj. Production experiments should pin the exact path.
  layers: [9]
  inner_params: "auto"
  edit_lr: 1.0
  n_iter: 40
  mask_ratio: 0.2
  norm_constraint: 1.0
  act_ratio: 0.8
  save_freq: 500
  merge_freq: 1000
  merge_strategy: "ties"
  merge_weight: 1.0
  density: 0.53
  alpha: 5.0
  beta: 20.0
  gamma: 10.0
