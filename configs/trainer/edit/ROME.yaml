# ROME knowledge editing (representative compute_z + rank-one update)

defaults:
  - /trainer/edit/base_editor@_here_
  - _self_

handler: ROMEEditor

method_args:
  implementation_variant: native_adapted
  v_loss_mode: final_logits
  kl_direction: base_to_edited
  context_templates: ["{}"]
  # Single layer (ROME); validated against model depth at runtime
  layers: [5]

  v_lr: 0.5
  v_num_grad_steps: 20
  v_weight_decay: 0.5
  clamp_norm_factor: 4.0
  v_loss_layer: 31
  kl_factor: 0.0625
  fact_token: subject_last

  # Standard ROME inverse second-moment whitening. Disable only for tiny
  # offline smoke runs where Wikipedia statistics are intentionally absent.
  mom2_adjustment: true
  mom2_dataset: wikipedia
  mom2_n_samples: 100000
  mom2_dtype: float32
  stats_dir: data/stats
  covariance_ridge: 1.0e-5

  rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
  layer_module_tmp: "model.layers.{}"
  lm_head_module: "lm_head"
  ln_f_module: "model.norm"
